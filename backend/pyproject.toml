[project]
name = "crm-backend"
version = "0.1.0"
description = "shaprivezu backend: FastAPI + dishka + asyncpg"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "dishka>=1.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "tzdata>=2024.1",  # Europe/Moscow для zoneinfo в slim-образе без системной tz-базы
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "asyncpg-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/crm/infrastructure/llm/client.py" = ["E501"]  # текст промпта
"src/crm/infrastructure/llm/prompt.py" = ["E501"]  # текст промпта
"tests/**" = ["B017", "E501"]
