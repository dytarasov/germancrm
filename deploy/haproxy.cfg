# SNI-развилка на 443: CRM (shaprivezu.com) и xray-VPN живут на одном порту.
# TLS не расшифровывается — haproxy смотрит только SNI в ClientHello и
# прокидывает байты как есть. Ставится на хост: /etc/haproxy/haproxy.cfg.
global
    log /dev/log local0
    maxconn 2048
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend tls443
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend crm_caddy if { req.ssl_sni -i shaprivezu.com }
    default_backend xray_vpn

backend crm_caddy
    # send-proxy-v2: передаём Caddy реальный IP клиента (PROXY protocol) —
    # без него баны за перебор пароля видели бы 127.0.0.1 вместо атакующего.
    server caddy 127.0.0.1:8443 send-proxy-v2

backend xray_vpn
    server xray 127.0.0.1:8444
